[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detector-testing-system"
version = "1.0.0"
description = "A library designed to test of the basic detectors parameters."
authors = [
    {name = "Pavel Vaschenko", email="vaschenko@vmk.ru"},
]
maintainers = [
    {name = "Pavel Vaschenko", email="vaschenko@vmk.ru"},
]
readme = "README.md"
license = {text = "MIT License"}
dependencies = [
    "distfit==1.7.3",
    "matplotlib==3.8.3",
    "numpy==1.26.4",
    "python-dotenv==1.0.1",
    "scipy==1.12.0",
    "tqdm==4.66.2",
    "vmk-spectrum3-wrapper",
    "vmk-spectrum3",
    "setuptools<82.0.0",
]
requires-python = "==3.10.*"

[dependency-groups]
linting = [
    "flake8",
    "flake8-commas",
    "flake8-import-order",
    "flake8-bugbear",
    "flake8-builtins",
    "pep8-naming",
]
testing = [
    "Faker",
    "pytest",
    "pytest-cov",
    "pytest-flake8",
]
notebook = [
    "ipykernel>=6.29.5",
    "jupyter==1.1.1",
]
dev = [
    {include-group = "linting"},
    {include-group = "testing"},
    {include-group = "notebook"},
]

[tool.uv.sources]
vmk-spectrum3-wrapper = { git = "https://github.com/Exinker/vmk-spectrum3-wrapper", tag = "0.4.0" }
vmk-spectrum3 = { git = "https://github.com/Exinker/vmk-spectrum3", rev = "0.1.0" }
